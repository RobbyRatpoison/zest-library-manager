[package]
name = "grid-own"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
memmap2 = "0.9"
dhat = { version = "0.3", optional = true }
grid-core = { path = "../grid-core" }
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "wayland", "x11"] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }
winit = "0.30"
softbuffer = "0.4"
bytemuck = "1"
pd-filter = { path = "../pd-filter" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder = "0.3"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
gilrs = "0.11.2"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[features]
dhat-heap = ["dep:dhat"]

[build-dependencies]
embed-resource = "3"
