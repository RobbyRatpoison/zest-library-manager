name: Build Zest

# A tag like v2026.11.1 builds the Linux tarball, the Flatpak bundle
# (app id io.github.robbyratpoison.Zest) and the Windows and macOS programs, and attaches them to a release. Run by hand it only builds.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev
      # the fast profile (no LTO): the tests check behavior, which LTO does not change, and it compiles in a fraction of the time
      - run: cargo test --profile fast --no-fail-fast -p pd-filter -p grid-core -p grid-own

  # the same tests on Windows and macOS exercise the per-OS code (path detection, emulator and Steam locations); informative only, nothing waits for them
  tests-other:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: cargo test --profile fast --no-fail-fast -p pd-filter -p grid-core -p grid-own

  linux:
    name: Linux tarball
    # the oldest supported runner, so the program runs on distributions with an older glibc (2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libwebkit2gtk-4.1-dev
      - run: sh package/build-release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with: { name: zest-linux, path: package/dist/*.tar.gz }

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          cd package/flatpak
          # the version the program reports (flatpak-builder has no switch for it: it goes into the manifest's build environment)
          sed -i "s|CARGO_HOME: /run/build/zest/cargo|CARGO_HOME: /run/build/zest/cargo\n        ZEST_BUILD_VERSION: \"${GITHUB_REF_NAME#v}\"|" io.github.robbyratpoison.Zest.yml
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir io.github.robbyratpoison.Zest.yml
          flatpak build-bundle repo zest.flatpak io.github.robbyratpoison.Zest
          mv zest.flatpak "../../Zest-${GITHUB_REF_NAME#v}-Linux.flatpak"
      - uses: actions/upload-artifact@v4
        with: { name: zest-flatpak, path: "Zest-*-Linux.flatpak" }

  windows:
    name: Windows program
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - shell: bash
        run: |
          [ "${GITHUB_REF_TYPE}" = tag ] && export ZEST_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release -p grid-own -p zest-login
      - shell: bash
        run: |
          mkdir -p dist/windows
          cp target/release/grid-own.exe dist/windows/Zest.exe
          cp target/release/zest-login.exe dist/windows/zest-login.exe
          7z a Zest-Windows-Portable.zip ./dist/windows/*
      # the installer (package/zest.iss); Inno Setup 6 from Chocolatey, as PlayDate's workflow does
      - run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          # Inno's version fields take numbers only: a -beta.N suffix goes into the display name, not VersionInfoVersion
          $num = $ver -replace '-.*$', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DNumVersion=$num" "/DDistDir=..\dist\windows" package\zest.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item package\dist\Zest-Setup.exe Zest-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: zest-windows, path: "Zest-Windows-Portable.zip\nZest-Setup.exe" }

  macos:
    name: macOS program
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: |
          V="${GITHUB_REF_NAME#v}"; [ "${GITHUB_REF_TYPE}" = tag ] || V="0.0.0-dev"
          sh package/make-macos-app.sh "$V"
      - uses: actions/upload-artifact@v4
        with: { name: zest-macos, path: package/dist/*.tar.gz }

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    # a failing Linux test blocks the release; the builds run alongside the tests rather than after them
    needs: [tests, linux, flatpak, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # install.sh checks each download against this list
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/checkout@v4
        with: { path: src, sparse-checkout: CHANGELOG.md, sparse-checkout-cone-mode: false }
      # the release notes are this version's CHANGELOG section (a beta uses its base version's section)
      - run: |
          base="${GITHUB_REF_NAME%%-*}"
          awk -v h="## $base" 'index($0, "## ")==1 { on = ($0 == h || index($0, h" ")==1); next } on' src/CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # a plain v2026.11.1 is a normal release (install.sh and the updater take "latest"); v2026.11.1-beta.1 is a prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: dist/*
